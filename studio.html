<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/><title>Shravan · Content Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--crimson:#B41D3E;--maroon:#901732;--yellow:#FEC917;--grey:#989898;--ink:#232323;--paper:#fff;--line:#e8e2e0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',system-ui,sans-serif;background:#faf8f7;color:var(--ink)}
header{background:var(--maroon);color:#fff;padding:18px 26px;display:flex;align-items:center;gap:14px}
header h1{font-size:17px;font-weight:800}header h1 b{color:var(--yellow)}
header .step{margin-left:auto;font-size:12px;font-weight:700;color:rgba(255,255,255,.75)}
main{max-width:1180px;margin:0 auto;padding:26px}
.hidden{display:none}
h2{font-size:15px;font-weight:800;margin:18px 0 10px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.toggle button{border:0;background:none;padding:9px 18px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--grey)}
.toggle button.on{background:var(--crimson);color:#fff}
.own{display:flex;gap:10px;margin:14px 0 22px}
.own input{flex:1;padding:12px 14px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px}
.btn{border:0;border-radius:10px;padding:12px 20px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;background:var(--crimson);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--yellow);color:#1a1a1a}
.btn:disabled{opacity:.5;cursor:wait}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;font-size:13.5px;font-weight:600;line-height:1.4}
.card:hover{border-color:var(--crimson)}
.card small{display:block;margin-top:8px;color:var(--grey);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.opt .tag{align-self:flex-start;background:#fbe7eb;color:var(--crimson);font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
.opt .why{font-size:12px;color:var(--grey);font-style:italic}
.opt pre{white-space:pre-wrap;font:inherit;font-size:13.5px;line-height:1.55;max-height:420px;overflow:auto}
.rowb{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.loading{padding:60px;text-align:center;color:var(--grey);font-weight:700}
iframe{width:100%;height:640px;border:1px solid var(--line);border-radius:12px;background:#ededed}
.note{font-size:12px;color:var(--grey);margin-top:8px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Shravan C. Mudaliar · <b>Content Studio</b></h1>
<div style="display:flex;gap:7px;align-items:center;margin-left:18px">
  <span style="font-size:10px;font-weight:800;letter-spacing:.14em;color:rgba(255,255,255,.55)">CONTENT&nbsp;OS</span>
  <a href="index.html" style="border:1px solid rgba(255,255,255,.35);color:#fff;font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px;text-decoration:none">Dashboard</a>
  <span style="background:var(--yellow);color:#1a1a1a;font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px">✍ Studio</span>
</div>
<span class="step" id="crumb">1 · Pick a topic</span></header>
<main>
  <section id="board">
    <h2>Format</h2>
    <div class="toggle" id="fmt"><button data-f="text" class="on">Text post</button><button data-f="carousel">Carousel</button></div>
    <h2>Your own topic</h2>
    <div class="own"><input id="own" placeholder="Type any topic — e.g. why fit-out handovers slip in the last 2 weeks"/><button class="btn" onclick="pick(document.getElementById('own').value)">Generate</button></div>
    <h2>Or pick from the idea bank (30)</h2>
    <div class="grid" id="titles"></div>
  </section>
  <section id="options" class="hidden"></section>
  <section id="approve" class="hidden"></section>
</main>
<script>
const WORKER_URL = 'https://maplecraft-studio.maplecraft.workers.dev';
const TITLES = [
 ['Why 70% of corporate interior projects get delayed','Project Governance'],
 ['Project Management vs Project Governance — the difference that costs money','Project Governance'],
 ['Why weekly project dashboards are non-negotiable','Project Governance'],
 ['How decision delays quietly destroy project timelines','Project Governance'],
 ['Why clients should separate design, execution and governance','Project Governance'],
 ['The biggest risk in multi-city office fit-out programmes','Risk Management'],
 ['The governance structure every ₹5–50 Cr project must have','Project Governance'],
 ['How project visibility reduces disputes','Project Governance'],
 ['The most ignored stage of any project: closure','Project Governance'],
 ['The toughest project situation I faced — and what it taught me','Leadership'],
 ['Why experience matters more than tools in project delivery','Execution Excellence'],
 ['What large companies do differently in project delivery','Execution Excellence'],
 ['The most difficult coordination challenge on a fit-out','Execution Excellence'],
 ['What site engineers should learn early in their career','Leadership'],
 ['Why communication is the most underrated project skill','Leadership'],
 ['Managing multidisciplinary teams — my biggest takeaway','Leadership'],
 ['5 questions every CEO should ask before starting an office fit-out','Corporate Interiors'],
 ['What corporate leaders must know before appointing an execution partner','Corporate Interiors'],
 ['Why project budgets explode in workplace interiors','Risk Management'],
 ['How governance can cut project delays — realistically','Project Governance'],
 ['Why workplace projects need independent project monitoring','Project Governance'],
 ['The hidden risks in fast-track office fit-outs','Risk Management'],
 ['Why coordination between MEP and interiors fails','Execution Excellence'],
 ['How to ensure accountability in large workplace projects','Project Governance'],
 ['What Lean Construction really means in interior projects','Lean Project Delivery'],
 ['Why planning meetings fail on construction sites','Lean Project Delivery'],
 ['The power of weekly work planning','Lean Project Delivery'],
 ['Activity tracking vs milestone tracking — the difference','Lean Project Delivery'],
 ['Why data-driven project delivery is the future','Execution Excellence'],
 ['My journey from site engineer to project delivery leader','Leadership'],
];
let fmt = 'text', topic = '', variants = [], chosen = null;

document.getElementById('titles').innerHTML = TITLES.map(([t,c],i)=>
 `<div class="card" onclick="pick(TITLES[${i}][0])">${t}<small>${c}</small></div>`).join('');
document.querySelectorAll('#fmt button').forEach(b=>b.onclick=()=>{fmt=b.dataset.f;
 document.querySelectorAll('#fmt button').forEach(x=>x.classList.toggle('on',x===b));});

function key(){let k=localStorage.getItem('studioKey');
 if(!k){k=prompt('Studio passcode:')||'';localStorage.setItem('studioKey',k);}return k;}
function state(id,crumb){['board','options','approve'].forEach(s=>
 document.getElementById(s).classList.toggle('hidden',s!==id));
 document.getElementById('crumb').textContent=crumb;window.scrollTo(0,0);}
function pick(t){ if(!t||!t.trim()) return; topic=t.trim(); generate(); }
const esc=s=>String(s).replace(/</g,'&lt;');
async function generate(){
  state('options','2 · Pick an option');
  const box=document.getElementById('options');
  box.innerHTML=`<div class="loading">Writing two options for "${esc(topic)}" …</div>`;
  try{
    const r=await fetch(WORKER_URL+'/generate',{method:'POST',
      headers:{'Content-Type':'application/json','X-Studio-Key':key()},
      body:JSON.stringify({topic,format:fmt})});
    if(r.status===401){localStorage.removeItem('studioKey');throw new Error('Wrong passcode — reload and try again.');}
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||('error '+r.status));
    variants=d.variants; renderOptions();
  }catch(e){box.innerHTML=`<div class="loading">⚠ ${e.message}</div>
    <div class="rowb"><button class="btn" onclick="generate()">Try again</button>
    <button class="btn alt" onclick="state('board','1 · Pick a topic')">← Back</button></div>`;}
}

function renderOptions(){
  document.getElementById('options').innerHTML=`
   <h2>${esc(topic)} · ${fmt==='carousel'?'Carousel':'Text post'}</h2>
   <div class="two">${variants.map((v,i)=>`
    <div class="opt"><span class="tag">${esc(v.category)}</span>
     <div class="why">Why this could perform: ${esc(v.why)}</div>
     <pre>${esc(v.caption)}</pre>
     ${v.deck?`<div class="note">${v.deck.length} carousel slides included — preview after picking.</div>`:''}
     <button class="btn" onclick="choose(${i})">Pick Option ${i+1}</button></div>`).join('')}
   </div>
   <div class="rowb"><button class="btn alt" onclick="generate()">↻ Regenerate both</button>
   <button class="btn alt" onclick="state('board','1 · Pick a topic')">← Different topic</button></div>`;
}

function choose(i){
  chosen=variants[i];
  if(chosen.deck) localStorage.setItem('studioDraftDeck',JSON.stringify(chosen.deck));
  renderApprove();
}

function nextMonday11IST(){
  // ponytail: computed in IST regardless of viewer timezone
  const now=new Date(Date.now()+5.5*3600e3); // shift to IST
  const d=new Date(now); d.setUTCDate(d.getUTCDate()+((8-d.getUTCDay())%7||7));
  return d.toISOString().slice(0,10)+' · 11:00 AM IST (Monday)';
}

function renderApprove(){
  state('approve','3 · Approve & schedule');
  document.getElementById('approve').innerHTML=`
   <h2>Final post — ${esc(topic)}</h2>
   <div class="opt"><span class="tag">${esc(chosen.category)}</span>
    <pre>${esc(chosen.caption)}</pre></div>
   ${chosen.deck?`<h2>Carousel preview</h2>
    <iframe src="carousel.html?post=DRAFT&embed=1"></iframe>
    <div class="note">PDF for LinkedIn: open <a href="carousel.html?post=DRAFT" target="_blank">full view</a> → "Save as PDF".</div>`:''}
   <div class="rowb">
    <button class="btn gold" onclick="navigator.clipboard.writeText(chosen.caption).then(()=>this.textContent='✓ Copied')">Copy caption</button>
    <button class="btn" onclick="schedule()">Schedule → ${nextMonday11IST()}</button>
    <button class="btn alt" onclick="renderOptions()||state('options','2 · Pick an option')">← Back to options</button>
   </div><div class="note" id="schednote"></div>`;
}

function schedule(){
  navigator.clipboard.writeText(chosen.caption);
  document.getElementById('schednote').innerHTML=
   `Caption copied. In Buffer (opening now): paste the caption, attach the carousel PDF if any, and set <b>${nextMonday11IST()}</b>.`;
  window.open('https://publish.buffer.com','_blank');
}
</script></body></html>
