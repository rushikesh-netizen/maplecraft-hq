<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/><title>Shravan · Content Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<style>
:root{--crimson:#B41D3E;--maroon:#901732;--yellow:#FEC917;--grey:#989898;--ink:#232323;--soft:#6b6b6b;--paper:#fff;--line:#e8e2e0;--bg:#faf8f7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
/* ---- topbar (mirrors dashboard) ---- */
.topbar{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:3px solid var(--crimson);padding:10px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.wm .w1{font-size:17px;font-weight:800;letter-spacing:-.01em}
.wm .w2{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--grey);margin-top:2px}
.tabs{display:flex;gap:7px;align-items:center;margin-left:10px}
.tabs a,.tabs .on{font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px;text-decoration:none}
.tabs a{border:1px solid var(--line);color:var(--ink)}
.tabs .on{background:var(--crimson);color:#fff}
.step{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--soft)}
main{max-width:1180px;margin:0 auto;padding:24px 26px 60px}
.hidden{display:none!important}
h2{font-size:15px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 .sub{font-size:11px;font-weight:600;color:var(--grey)}
/* ---- how-it-works strip ---- */
.howto{display:flex;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:18px}
.howto div{flex:1;padding:13px 18px;font-size:12.5px;font-weight:600;color:var(--soft);display:flex;gap:10px;align-items:center;border-right:1px solid var(--line)}
.howto div:last-child{border-right:0}
.howto b{flex:0 0 auto;width:26px;height:26px;border-radius:999px;background:#fbe7eb;color:var(--crimson);display:flex;align-items:center;justify-content:center;font-size:12px}
/* ---- toolbar ---- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 4px}
.pill{border:1px solid var(--line);background:var(--paper);color:var(--soft);font:inherit;font-size:12px;font-weight:700;padding:8px 16px;border-radius:999px;cursor:pointer}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{border:0;border-radius:10px;padding:12px 20px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;background:var(--crimson);color:#fff}
.btn.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--yellow);color:#1a1a1a}
.btn:disabled{opacity:.5;cursor:wait}
.chip-next{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;background:#fff6d6;color:#7a5c00;border:1px solid #f4e3a1;padding:7px 13px;border-radius:999px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.toggle button{border:0;background:none;padding:9px 18px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--grey)}
.toggle button.on{background:var(--crimson);color:#fff}
.own{display:flex;gap:10px;margin:12px 0 4px}
.own input{flex:1;padding:12px 14px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
/* ---- idea cards ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;margin-top:12px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;cursor:pointer;font-size:13.5px;font-weight:600;line-height:1.4;transition:border-color .12s}
.card:hover{border-color:var(--crimson)}
.card .cat{display:inline-block;margin-top:10px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.card .heart{position:absolute;top:10px;right:10px;border:0;background:none;font-size:17px;cursor:pointer;color:#d5cfcc;line-height:1}
.card .heart.on{color:var(--crimson)}
.card .new{position:absolute;top:12px;left:-7px;background:var(--yellow);color:#1a1a1a;font-size:9px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:4px}
.cat[data-p="Project Governance"]{background:#fbe7eb;color:var(--crimson)}
.cat[data-p="Lean Project Delivery"]{background:#fff6d6;color:#7a5c00}
.cat[data-p="Execution Excellence"]{background:#f3e3e7;color:var(--maroon)}
.cat[data-p="Risk Management"]{background:#3a3a3a;color:#fff}
.cat[data-p="Corporate Interiors"]{background:#efeceb;color:#555}
.cat[data-p="Leadership"]{background:#e9eef4;color:#2b4a6f}
.empty-note{padding:36px;text-align:center;color:var(--grey);font-weight:600;font-size:13px;background:var(--paper);border:1px dashed var(--line);border-radius:14px;margin-top:12px}
/* ---- calendar ---- */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.slot{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.slot.past{opacity:.55}
.slot .d{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--soft)}
.slot .t{font-size:13px;font-weight:700;line-height:1.35;margin:8px 0 10px;min-height:36px}
.slot .t.open{color:var(--grey);font-weight:600}
.st{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;padding:4px 10px;border-radius:999px}
.st.pub{background:#e7f0e7;color:#2e6b2e}.st.plan{background:#fbe7eb;color:var(--crimson)}
.st.sched{background:#fff6d6;color:#7a5c00}.st.open{background:#f1efee;color:var(--grey)}
/* ---- options / approve ---- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.opt .tag{align-self:flex-start;background:#fbe7eb;color:var(--crimson);font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
.opt .why{font-size:12px;color:var(--grey);font-style:italic}
.opt pre{white-space:pre-wrap;font:inherit;font-size:13.5px;line-height:1.55;max-height:420px;overflow:auto}
.opt .vmeta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:.05em;color:var(--grey)}
.card .drafts{position:absolute;bottom:12px;right:12px;font-size:10px;font-weight:800;background:#e9eef4;color:#2b4a6f;padding:3px 8px;border-radius:999px}
textarea.edit{width:100%;min-height:360px;font:inherit;font-size:13.5px;line-height:1.6;padding:16px;border:1.5px solid var(--line);border-radius:12px;background:#fffefb;resize:vertical;outline-color:var(--crimson)}
.editnote{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--grey);margin-top:6px}
.rowb{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.loading{padding:60px;text-align:center;color:var(--grey);font-weight:700}
iframe{width:100%;height:640px;border:1px solid var(--line);border-radius:12px;background:#ededed}
.note{font-size:12px;color:var(--grey);margin-top:8px}
@media(max-width:820px){.two{grid-template-columns:1fr}.howto{flex-direction:column}.howto div{border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body>
<header class="topbar">
  <div class="wm"><div class="w1">Shravan C. Mudaliar</div><div class="w2">CONTENT OS · LINKEDIN STUDIO</div></div>
  <div class="tabs"><a href="index.html">Dashboard</a><span class="on">✍ Studio</span></div>
  <span class="step" id="crumb">1 · PICK A TOPIC</span>
</header>
<main>
  <section id="board">
    <div class="howto">
      <div><b>1</b>Pick an idea below — or type your own</div>
      <div><b>2</b>Choose one of two drafts written in your voice</div>
      <div><b>3</b>Approve &amp; schedule for Monday 11:00</div>
    </div>
    <h2>Format</h2>
    <div class="toggle" id="fmt"><button data-f="text" class="on">Text post</button><button data-f="carousel">Carousel</button></div>
    <h2>Your own topic</h2>
    <div class="own"><input id="own" placeholder="Type any topic — e.g. why fit-out handovers slip in the last 2 weeks"/><button class="btn" onclick="pick(document.getElementById('own').value)">Generate</button></div>
    <h2>Idea bank <span class="sub" id="bankcount"></span></h2>
    <div class="toolbar">
      <button class="pill on" id="f-all" onclick="setFilter('all')">All ideas</button>
      <button class="pill" id="f-favs" onclick="setFilter('favs')">★ Favourites</button>
      <button class="btn gold" id="refreshbtn" onclick="refreshIdeas()">↻ Fresh ideas</button>
      <span class="chip-next" id="nextchip"></span>
    </div>
    <div class="grid" id="titles"></div>
    <h2>📅 Content calendar <span class="sub">every Monday · 11:00 IST</span></h2>
    <div class="cal" id="cal"></div>
  </section>
  <section id="options" class="hidden"></section>
  <section id="approve" class="hidden"></section>
</main>
<script>
const WORKER_URL = 'https://maplecraft-studio.maplecraft.workers.dev';
const TITLES = [
 ['Why 70% of corporate interior projects get delayed','Project Governance'],
 ['Project Management vs Project Governance — the difference that costs money','Project Governance'],
 ['Why weekly project dashboards are non-negotiable','Project Governance'],
 ['How decision delays quietly destroy project timelines','Project Governance'],
 ['Why clients should separate design, execution and governance','Project Governance'],
 ['The biggest risk in multi-city office fit-out programmes','Risk Management'],
 ['The governance structure every ₹5–50 Cr project must have','Project Governance'],
 ['How project visibility reduces disputes','Project Governance'],
 ['The most ignored stage of any project: closure','Project Governance'],
 ['The toughest project situation I faced — and what it taught me','Leadership'],
 ['Why experience matters more than tools in project delivery','Execution Excellence'],
 ['What large companies do differently in project delivery','Execution Excellence'],
 ['The most difficult coordination challenge on a fit-out','Execution Excellence'],
 ['What site engineers should learn early in their career','Leadership'],
 ['Why communication is the most underrated project skill','Leadership'],
 ['Managing multidisciplinary teams — my biggest takeaway','Leadership'],
 ['5 questions every CEO should ask before starting an office fit-out','Corporate Interiors'],
 ['What corporate leaders must know before appointing an execution partner','Corporate Interiors'],
 ['Why project budgets explode in workplace interiors','Risk Management'],
 ['How governance can cut project delays — realistically','Project Governance'],
 ['Why workplace projects need independent project monitoring','Project Governance'],
 ['The hidden risks in fast-track office fit-outs','Risk Management'],
 ['Why coordination between MEP and interiors fails','Execution Excellence'],
 ['How to ensure accountability in large workplace projects','Project Governance'],
 ['What Lean Construction really means in interior projects','Lean Project Delivery'],
 ['Why planning meetings fail on construction sites','Lean Project Delivery'],
 ['The power of weekly work planning','Lean Project Delivery'],
 ['Activity tracking vs milestone tracking — the difference','Lean Project Delivery'],
 ['Why data-driven project delivery is the future','Execution Excellence'],
 ['My journey from site engineer to project delivery leader','Leadership'],
];
/* Rolling Monday slots — blank slate: nothing is "published" unless it was actually scheduled here. */
const SLOT_COUNT = 15;   // 2 recent Mondays + ~3 months ahead
let fmt='text', topic='', variants=[], chosen=null, filter='all';
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let bank=ls('ideaBank',null)||TITLES.slice();
let fresh=new Set(ls('ideaBankNew',[]));
let favs=new Set(ls('studioFavs',[]));
let drafts=ls('studioDrafts',{});   // {topic: [{caption,deck,category,why,fmt,at}, ...]} — every generation is kept
let chosenIdx=-1;
const esc=s=>String(s).replace(/</g,'&lt;');

function key(){let k=localStorage.getItem('studioKey');
 if(!k){k=prompt('Studio passcode:')||'';localStorage.setItem('studioKey',k);}return k;}
function state(id,crumb){['board','options','approve'].forEach(s=>
 document.getElementById(s).classList.toggle('hidden',s!==id));
 document.getElementById('crumb').textContent=crumb;window.scrollTo(0,0);}
function pick(t){ if(!t||!t.trim()) return; topic=t.trim(); renderTopic(); }

/* ---- idea board ---- */
function setFilter(f){filter=f;
 document.getElementById('f-all').classList.toggle('on',f==='all');
 document.getElementById('f-favs').classList.toggle('on',f==='favs');
 renderBoard();}
function toggleFav(i,ev){ev.stopPropagation();const t=bank[i][0];
 favs.has(t)?favs.delete(t):favs.add(t);save('studioFavs',[...favs]);renderBoard();}
function renderBoard(){
 const rows=bank.map((p,i)=>({t:p[0],c:p[1],i})).filter(r=>filter==='all'||favs.has(r.t));
 document.getElementById('bankcount').textContent=`· ${rows.length} shown / ${bank.length} total`;
 document.getElementById('titles').innerHTML=rows.length?rows.map(r=>
  `<div class="card" onclick="pick(bank[${r.i}][0])">
    ${fresh.has(r.t)?'<span class="new">NEW</span>':''}
    <button class="heart ${favs.has(r.t)?'on':''}" title="favourite" onclick="toggleFav(${r.i},event)">${favs.has(r.t)?'♥':'♡'}</button>
    ${esc(r.t)}<br><span class="cat" data-p="${esc(r.c)}">${esc(r.c)}</span>
    ${(drafts[r.t]||[]).length?`<span class="drafts">📝 ${(drafts[r.t]||[]).length} draft${(drafts[r.t]||[]).length>1?'s':''}</span>`:''}
  </div>`).join(''):
  `<div class="empty-note">No favourites yet — tap the ♡ on any idea to save it here.</div>`;
}
async function refreshIdeas(){
 const b=document.getElementById('refreshbtn');b.disabled=true;b.textContent='↻ Thinking…';
 try{
  const r=await fetch(WORKER_URL+'/generate',{method:'POST',
   headers:{'Content-Type':'application/json','X-Studio-Key':key()},
   body:JSON.stringify({topic:bank.map(p=>p[0]).join('; '),format:'ideas'})});
  if(r.status===401){localStorage.removeItem('studioKey');throw new Error('Wrong passcode — reload and try again.');}
  const d=await r.json(); if(!r.ok) throw new Error(d.error||('error '+r.status));
  const add=d.ideas.filter(p=>!bank.some(q=>q[0]===p[0]));
  bank=[...add,...bank].slice(0,60);
  fresh=new Set(add.map(p=>p[0]));
  save('ideaBank',bank);save('ideaBankNew',[...fresh]);
  setFilter('all');
 }catch(e){alert('Could not fetch ideas: '+e.message);}
 b.disabled=false;b.textContent='↻ Fresh ideas';
}

/* ---- calendar (blank slate: only real scheduling activity shows) ---- */
function todayISO(){const d=new Date(Date.now()+5.5*3600e3);return d.toISOString().slice(0,10);}
function mondays(){
 // window: 2 Mondays back through ~3 months ahead
 const now=new Date(Date.now()+5.5*3600e3);
 const d=new Date(now); d.setUTCDate(d.getUTCDate()+((8-d.getUTCDay())%7||7)-21);
 return Array.from({length:SLOT_COUNT},(_,i)=>{
  const m=new Date(d); m.setUTCDate(m.getUTCDate()+i*7); return m.toISOString().slice(0,10);});
}
function firstFreeMondayISO(){
 const cal=ls('studioCal',{}); let d=nextMondayISO();
 for(let i=0;i<52;i++){ if(!cal[d]) return d;
  const n=new Date(d+'T00:00:00Z'); n.setUTCDate(n.getUTCDate()+7); d=n.toISOString().slice(0,10);}
 return d;
}
function renderCal(){
 const cal=ls('studioCal',{}), today=todayISO();
 document.getElementById('cal').innerHTML=mondays().map((d,idx)=>{
  const sched=cal[d]; const past=d<today;
  const title=sched?sched.topic:'Open slot — pick from the idea bank';
  let st,cls;
  if(sched&&past){st='✓ Done';cls='pub';}
  else if(sched){st='✅ Scheduled';cls='sched';}
  else if(past){st='· Skipped';cls='open';}
  else{st='◻ Open';cls='open';}
  return `<div class="slot ${past?'past':''}">
    <div class="d">MON ${d.slice(8,10)}/${d.slice(5,7)}</div>
    <div class="t ${sched?'':'open'}">${esc(title)}</div>
    <span class="st ${cls}">${st}</span></div>`;
 }).join('')+
 `<div class="slot" style="display:flex;align-items:center;justify-content:center">
   <button class="pill" onclick="if(confirm('Clear every scheduled entry from the calendar?')){localStorage.removeItem('studioCal');renderCal();}">⟲ Reset calendar</button></div>`;
 const nm=nextMondayISO();
 document.getElementById('nextchip').textContent=
  `NEXT POST · MON ${nm.slice(8,10)}/${nm.slice(5,7)} · 11:00 IST${cal[nm]?' · SCHEDULED ✓':''}`;
}

/* ---- topic workspace: stored variations + controlled generation ---- */
function renderTopic(msg){
  state('options','2 · GENERATE & PICK');
  const list=drafts[topic]||[];
  document.getElementById('options').innerHTML=`
   <h2>${esc(topic)}</h2>
   <div class="rowb" style="margin-top:6px">
    <div class="toggle" id="fmt2">
      <button data-f="text" class="${fmt==='text'?'on':''}">Text post</button>
      <button data-f="carousel" class="${fmt==='carousel'?'on':''}">Carousel</button>
    </div>
    <button class="btn" id="genbtn" onclick="generate()">⚡ Generate 2 ${list.length?'more ':''}options</button>
    <button class="btn alt" onclick="state('board','1 · PICK A TOPIC')">← Back to ideas</button>
   </div>
   ${msg?`<div class="loading" id="genmsg">${msg}</div>`:''}
   <h2 style="margin-top:22px">Saved variations <span class="sub">· ${list.length} stored — nothing is lost when you leave</span></h2>
   ${list.length?`<div class="two">${list.map((v,i)=>`
    <div class="opt"><span class="tag">${esc(v.category)}</span>
     <div class="vmeta">${v.fmt==='carousel'?'CAROUSEL':'TEXT POST'} · ${(v.at||'').slice(0,10)} ${v.edited?'· ✎ EDITED':''}</div>
     <div class="why">Why this could perform: ${esc(v.why)}</div>
     <pre>${esc(v.caption)}</pre>
     ${v.deck?`<div class="note">${v.deck.length} carousel slides — preview after picking.</div>`:''}
     <div class="rowb" style="margin-top:4px">
       <button class="btn" onclick="choose(${i})">Use this one</button>
       <button class="btn alt" onclick="delDraft(${i})">🗑</button>
     </div></div>`).join('')}</div>`:
   `<div class="empty-note">No drafts for this topic yet — hit ⚡ Generate to write the first two options.</div>`}`;
  document.querySelectorAll('#fmt2 button').forEach(b=>b.onclick=()=>{fmt=b.dataset.f;
    document.querySelectorAll('#fmt2 button').forEach(x=>x.classList.toggle('on',x===b));});
}
function delDraft(i){ (drafts[topic]||[]).splice(i,1); save('studioDrafts',drafts); renderTopic(); }
async function generate(){
  const b=document.getElementById('genbtn'); if(b){b.disabled=true;b.textContent='⚡ Writing…';}
  try{
    const r=await fetch(WORKER_URL+'/generate',{method:'POST',
      headers:{'Content-Type':'application/json','X-Studio-Key':key()},
      body:JSON.stringify({topic,format:fmt})});
    if(r.status===401){localStorage.removeItem('studioKey');throw new Error('Wrong passcode — reload and try again.');}
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||('error '+r.status));
    const at=new Date().toISOString();
    drafts[topic]=[...d.variants.map(v=>({...v,fmt,at})),...(drafts[topic]||[])].slice(0,12);
    save('studioDrafts',drafts);
    renderTopic();
  }catch(e){ renderTopic(`⚠ ${e.message}`); }
}
function choose(i){
  chosen=drafts[topic][i]; chosenIdx=i;
  if(chosen.deck) localStorage.setItem('studioDraftDeck',JSON.stringify(chosen.deck));
  renderApprove();
}
function nextMondayISO(){
  const now=new Date(Date.now()+5.5*3600e3);
  const d=new Date(now); d.setUTCDate(d.getUTCDate()+((8-d.getUTCDay())%7||7));
  return d.toISOString().slice(0,10);
}
function renderApprove(){
  state('approve','3 · EDIT, APPROVE & SCHEDULE');
  document.getElementById('approve').innerHTML=`
   <h2>Final post — ${esc(topic)} <span class="sub">· ${esc(chosen.category)}</span></h2>
   <textarea class="edit" id="editbox" spellcheck="true">${esc(chosen.caption)}</textarea>
   <div class="editnote">✎ EDIT FREELY — changes save automatically to this variation.</div>
   ${chosen.deck?`<h2>Carousel preview</h2>
    <iframe src="carousel.html?post=DRAFT&embed=1"></iframe>
    <div class="note">PDF for LinkedIn: open <a href="carousel.html?post=DRAFT" target="_blank">full view</a> → "Save as PDF". (Slide text comes from the generation — to change slides, edit here for the caption and ⚡ regenerate for a new deck.)</div>`:''}
   <div class="rowb">
    <button class="btn gold" onclick="navigator.clipboard.writeText(chosen.caption).then(()=>this.textContent='✓ Copied')">Copy caption</button>
    <button class="btn" onclick="schedule()">Schedule → Mon ${firstFreeMondayISO().slice(8,10)}/${firstFreeMondayISO().slice(5,7)} · 11:00 IST</button>
    <button class="btn alt" onclick="renderTopic()">← Back to variations</button>
   </div><div class="note" id="schednote"></div>`;
  const box=document.getElementById('editbox');
  box.addEventListener('input',()=>{
    chosen.caption=box.value; chosen.edited=true;
    if(chosenIdx>=0&&drafts[topic]&&drafts[topic][chosenIdx]){drafts[topic][chosenIdx]=chosen; save('studioDrafts',drafts);}
  });
}
function schedule(){
  navigator.clipboard.writeText(chosen.caption);
  const d=firstFreeMondayISO(), cal=ls('studioCal',{});   // first Monday without a post — never overwrites
  cal[d]={topic,at:new Date().toISOString()}; save('studioCal',cal); renderCal();
  document.getElementById('schednote').innerHTML=
   `Caption copied and the <b>Mon ${d.slice(8,10)}/${d.slice(5,7)}</b> slot is marked on the calendar. In Buffer (opening now): paste the caption, attach the carousel PDF if any, and set <b>${d} · 11:00 AM IST</b>.`;
  window.open('https://publish.buffer.com','_blank');
}

/* ---- boot ---- */
document.querySelectorAll('#fmt button').forEach(b=>b.onclick=()=>{fmt=b.dataset.f;
 document.querySelectorAll('#fmt button').forEach(x=>x.classList.toggle('on',x===b));});
renderBoard(); renderCal();
</script></body></html>
